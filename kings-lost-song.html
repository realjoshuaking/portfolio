    background: repeating-linear-gradient(180deg, #050507 0 4px, #1d1d24 4px 7px);

  #screen { position: relative; flex: 1; min-width: 0; border-radius: 16px; overflow: hidden; background: #000;

    background: repeating-linear-gradient(180deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px); }
  #glass { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;

  #screenv { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;

  .knob { width: 36px; height: 36px; border-radius: 50%; flex: none;

"use strict";
/* =====================================================================
   THE KING'S LOST SONG: a secret 8-bit adventure for the portfolio site
   Music hooks: Joshua composes all tracks. See MUSIC.tracks below.
   ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 384, H = 224, TILE = 16;
const VW = 24, VH = 14; // viewport in tiles

/* Canvas is sized by CSS inside the retro TV frame; internal res stays 384x224. */

/* ---------------- Audio: SFX synth + Joshua's music slots ---------------- */
const AudioSys = {
  ctx: null, muted: false,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, slideTo) {
    if (!this.ctx || this.muted || game.muteZone) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  swing()  { this.tone(300, 0.09, 'square', 0.07, 90); },
  hit()    { this.tone(160, 0.12, 'sawtooth', 0.10, 60); },
  hurt()   { this.tone(220, 0.25, 'sawtooth', 0.12, 55); },
  blip()   { this.tone(880, 0.05, 'square', 0.06); },
  chime(i) { // note collect: C D E F G A B C
    const scale = [261.6, 293.7, 329.6, 349.2, 392.0, 440.0, 493.9, 523.3];
    this.tone(scale[i % 8], 0.35, 'triangle', 0.14);
    setTimeout(() => this.tone(scale[i % 8] * 2, 0.3, 'triangle', 0.08), 90);
  },
  fanfare(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.22, 'square', 0.1), i * 130)); },
  noise(dur, vol, filterFreq) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 400;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  },
  thunder() { this.noise(1.5, 0.28, 160); this.tone(110, 1.1, 'sine', 0.20, 30); },
  boom()    { this.tone(72, 0.5, 'sine', 0.30, 32); this.noise(0.3, 0.18, 800); },
  thud()    { this.tone(150, 0.12, 'sine', 0.13, 65); },
  playSong(){ // the restored perfect song: gentle 8-note melody
    const seq = [523.3, 587.3, 659.3, 784.0, 659.3, 587.3, 523.3, 392.0];
    seq.forEach((f, i) => { setTimeout(() => this.tone(f, 0.5, 'triangle', 0.13), i * 340);
      setTimeout(() => this.tone(f / 2, 0.5, 'sine', 0.07), i * 340); });
  }
};
/* Joshua's music: drop files in and set these URLs. Loops automatically. */
const MUSIC = {
  tracks: { title: null, overworld: null, dungeon: null, castle: null, boss: null },
  el: {}, current: null,
  play(name) {
    if (this.current === name) return;
    this.stop();
    const url = this.tracks[name];
    if (!url) return; // Joshua hasn't delivered this track yet: silence
    const a = new Audio(url); a.loop = true; a.volume = 0.7;
    a.play().catch(() => {});
    this.el[name] = a; this.current = name;
  },
  stop() {
    for (const k in this.el) { try { this.el[k].pause(); } catch (e) {} }
    this.el = {}; this.current = null;
  }
};

/* ---------------- Input: keyboard + touch ---------------- */
const Input = {
  up: false, down: false, left: false, right: false,
  atk: false, skip: false, start: false,
  _atkQ: false, _startQ: false,
  init() {
    const km = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
      ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
    window.addEventListener('keydown', e => {
      AudioSys.init();
      if (e.repeat) return; // one action per physical keystroke, no OS key repeat
      if (km[e.code]) { this[km[e.code]] = true; e.preventDefault(); }
      if (e.code === 'Space' || e.code === 'KeyJ') { this._atkQ = true; e.preventDefault(); }
      if (e.code === 'Enter') { this._startQ = true; }
      if (e.code === 'Escape' || e.code === 'KeyK') { this.skip = true; }
      if (game.state === 'name' && e.key && e.key.length === 1) NameEntry.type(e.key);
      if (game.state === 'name' && e.code === 'Backspace') NameEntry.back();
    });
    window.addEventListener('keyup', e => {
      if (km[e.code]) this[km[e.code]] = false;
      if (e.code === 'Escape' || e.code === 'KeyK') this.skip = false;
    });
    const bind = (id, prop) => {
      const el = document.getElementById(id);
      const on = e => { e.preventDefault(); AudioSys.init(); this[prop] = true;
        if (prop === 'atk') this._atkQ = true; if (prop === 'start') this._startQ = true; };
      const off = e => { e.preventDefault(); this[prop] = false; };
      el.addEventListener('touchstart', on, { passive: false });
      el.addEventListener('touchend', off, { passive: false });
      el.addEventListener('touchcancel', off, { passive: false });
      el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
    };
    bind('dUp', 'up'); bind('dDown', 'down'); bind('dLeft', 'left'); bind('dRight', 'right');
    bind('btnA', 'atk'); bind('btnB', 'skip');
    cv.addEventListener('touchstart', e => {
      e.preventDefault(); AudioSys.init();
      // canvas taps only advance in these states (name/customize use their own tap zones)
      if (['title', 'gameover', 'scores'].includes(game.state)) this._startQ = true;
    }, { passive: false });
    cv.addEventListener('mousedown', () => {
      AudioSys.init();
      if (['title', 'gameover', 'scores'].includes(game.state)) this._startQ = true;
    });
    if ('ontouchstart' in window) document.getElementById('touch').classList.add('on');
  },
  consumeAtk() { const q = this._atkQ; this._atkQ = false; return q; },
  consumeStart() { const q = this._startQ; this._startQ = false; return q; }
};

/* ---------------- Pixel sprite system ---------------- */
function makeSprite(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x], col = pal[ch];
    if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  }
  return c;
}
function drawSpr(img, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + img.width, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); }
  else ctx.drawImage(img, x, y);
}

/* ---------------- Maps ---------------- */
// tile chars: # solid border, . ground, , flowers, ~ water, = bridge,
// T tree, f dungeon floor, d castle floor, M mute zone, * pillar,
// + carpet, D door/exit, P player start, N note, E enemy, C critic, S sign
const SOLID = new Set(['#', 'T', '~', '*']);
function newMap(w, h, base) {
  const m = []; for (let y = 0; y < h; y++) m.push(new Array(w).fill(base)); return m;
}
function rect(m, x, y, w, h, ch) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
    if (j >= 0 && j < m.length && i >= 0 && i < m[0].length) m[j][i] = ch;
}
function border(m, ch) {
  const w = m[0].length, h = m.length;
  for (let x = 0; x < w; x++) { m[0][x] = ch; m[h - 1][x] = ch; }
  for (let y = 0; y < h; y++) { m[y][0] = ch; m[y][w - 1] = ch; }
}
function scatter(m, ch, n, avoid) {
  const w = m[0].length, h = m.length; let placed = 0, guard = 0;
  while (placed < n && guard++ < 500) {
    const x = 2 + Math.floor(Math.random() * (w - 4)), y = 2 + Math.floor(Math.random() * (h - 4));
    if (m[y][x] === '.' || m[y][x] === 'f' || m[y][x] === 'd') { m[y][x] = ch; placed++; }
  }
}

/* ---------------- Particles & hit-stop ---------------- */
const Parts = {
  list: [],
  spawn(x, y, col, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.5 + Math.random()) * (spd || 1.5);
      this.list.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 24 + Math.random() * 14, col });
    }
  },
  poof(x, y) { this.spawn(x, y, '#e8e4f4', 10, 1.6); this.spawn(x, y, '#8f86b8', 6, 1.1); },
  spark(x, y) { this.spawn(x, y, '#ffd250', 7, 2.2); this.spawn(x, y, '#ffffff', 4, 1.6); },
  noteBurst(x, y) { this.spawn(x, y, '#ffd250', 12, 1.8); this.spawn(x, y, '#fff3b0', 8, 1.2); },
  update() {
    for (const p of this.list) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life--; }
    this.list = this.list.filter(p => p.life > 0);
  },
  draw(camx, camy) {
    for (const p of this.list) {
      ctx.globalAlpha = Math.min(1, p.life / 14);
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x - camx), Math.round(p.y - camy), 3, 3);
    }
    ctx.globalAlpha = 1;
  }
};
/* ---------------- Game state ---------------- */
const game = {
  state: 'boot', areaIdx: 0, area: null,
  cam: { x: 0, y: 0 }, time: 0, startTime: 0,
  notes: 0, notesTotal: 8, muteZone: false,
  player: null, enemies: [], projs: [], notesList: [], npcs: [],
  dialog: null, shake: 0, fade: 0, fadeDir: 0, fadeCb: null,
  boss: null, bossDefeated: false, criticDefeated: false, atBoss: false,
  tunic: 0, hat: 2, playerName: 'KING', hitStop: 0, heartsDrops: []
};
function tileAt(px, py) {
  const m = game.area.map, tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (ty < 0 || ty >= m.length || tx < 0 || tx >= m[0].length) return '#';
  return m[ty][tx];
}
function solidAt(px, py) { return SOLID.has(tileAt(px, py)); }
function tileCenter(tx, ty) { return { x: tx * TILE + 8, y: ty * TILE + 8 }; }

function loadArea(idx, spawnOverride) {
  game.areaIdx = idx;
  game.area = AREAS[idx]();
  const m = game.area.map;
  game.enemies = []; game.projs = []; game.notesList = []; game.npcs = [];
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m[0].length; x++) {
    const ch = m[y][x], c = tileCenter(x, y);
    if (ch === 'P') { game.player.x = c.x - 8; game.player.y = c.y - 8; m[y][x] = idx === 0 ? '.' : (idx === 1 ? 'f' : 'd'); }
    else if (ch === 'N') { game.notesList.push({ x: c.x, y: c.y, taken: false, idx: game.notesList.length }); m[y][x] = idx === 0 ? '.' : (idx === 1 ? 'f' : 'd'); }
    else if (ch === 'E') { spawnEnemy(idx === 0 ? 'blank' : 'doubt', c.x, c.y); m[y][x] = idx === 0 ? '.' : (idx === 1 ? 'f' : 'd'); }
    else if (ch === 'C' && !game.criticDefeated) { spawnEnemy('critic', c.x, c.y); m[y][x] = 'f'; }
    else if (ch === 'C') m[y][x] = 'f';
  }
  if (spawnOverride) { game.player.x = spawnOverride.x; game.player.y = spawnOverride.y; }
  game.area.npcs.forEach(n => game.npcs.push({ x: n.x * TILE, y: n.y * TILE, dialog: n.dialog }));
  MUSIC.play(game.area.music);
  snapCamera();
}
function spawnEnemy(type, x, y) {
  const base = { x: x - 8, y: y - 8, type, t: Math.random() * 60, dir: 1, hurt: 0, kx: 0, ky: 0 };
  if (type === 'blank') Object.assign(base, { w: 14, h: 12, hp: 2, speed: 0.30, dmg: 1 });
  if (type === 'doubt') Object.assign(base, { w: 14, h: 12, hp: 3, speed: 0.40, dmg: 1, slowT: 0 });
  if (type === 'critic') Object.assign(base, { w: 20, h: 20, hp: 10, speed: 0.28, dmg: 1 });
  game.enemies.push(base);
}
function newPlayer() {
  return { x: 0, y: 0, w: 12, h: 13, dir: 'down', hearts: 3, maxHearts: 3,
    speed: 0.95, swing: 0, swingCd: 0, iframe: 0, walkT: 0, moving: false,
    slowT: 0, dead: false };
}
function snapCamera() {
  const p = game.player;
  game.cam.x = Math.max(0, Math.min(game.area.map[0].length * TILE - W, p.x + 8 - W / 2));
  game.cam.y = Math.max(0, Math.min(game.area.map.length * TILE - H, p.y + 8 - H / 2));
}
function fadeTo(cb) { game.fadeDir = 1; game.fadeCb = cb; }

/* ---------------- Dialogue ---------------- */
function startDialog(lines, cb) {
  game.dialog = { lines, i: 0, chars: 0, done: false, cb };
  game.preDialogState = game.state; game.state = 'dialog';
  AudioSys.blip();
}
function updateDialog() {
  const d = game.dialog, line = d.lines[d.i];
  if (Input.consumeAtk() || Input.consumeStart() || Input.skip) {
    if (!d.done) { d.chars = line[1].length; d.done = true; }
    else {
      d.i++; d.chars = 0; d.done = false; AudioSys.blip();
      if (d.i >= d.lines.length) { game.state = game.preDialogState || 'play'; const cb = d.cb; game.dialog = null; if (cb) cb(); }
    }
    Input.skip = false;
  } else if (!d.done) {
    d.chars += 0.6;
    if (Math.floor(d.chars) % 3 === 0) AudioSys.blip();
    if (d.chars >= d.lines[d.i][1].length) { d.chars = d.lines[d.i][1].length; d.done = true; }
  }
}
function drawDialog() {
  const d = game.dialog; if (!d) return;
  const line = d.lines[d.i], text = line[1].substring(0, Math.floor(d.chars));
  ctx.fillStyle = 'rgba(5,5,12,0.88)';
  ctx.fillRect(16, H - 64, W - 32, 52);
  ctx.strokeStyle = '#ffd250'; ctx.lineWidth = 2; ctx.strokeRect(16, H - 64, W - 32, 52);
  ctx.fillStyle = '#ffd250'; ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillText(line[0].toUpperCase(), 26, H - 48);
  ctx.fillStyle = '#f4f4f4'; ctx.font = '10px "Courier New", monospace';
  wrapText(text, 26, H - 34, W - 52, 13);
  if (d.done) { ctx.fillStyle = '#ffd250'; ctx.fillText('▼', W - 32, H - 20); }
}
function wrapText(text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '', yy = y;
  ctx.font = '10px "Courier New", monospace';
  for (const w of words) {
    if (ctx.measureText(line + w).width > maxW) { ctx.fillText(line, x, yy); line = ''; yy += lh; }
    line += w + ' ';
  }
  ctx.fillText(line, x, yy);
}

/* ---------------- Player & combat ---------------- */
function hurtPlayer(dmg) {
  const p = game.player;
  if (p.iframe > 0 || p.dead) return;
  p.hearts -= dmg; p.iframe = 70; game.shake = 8;
  AudioSys.hurt();
  if (p.hearts <= 0) { p.dead = true; fadeTo(() => { game.state = 'gameover'; game.goT = 0; }); }
}
function tryMove(p, dx, dy) {
  const sp = p.slowT > 0 ? p.speed * 0.55 : p.speed;
  dx *= sp; dy *= sp;
  if (dx !== 0) {
    const nx = p.x + dx;
    const ok = dx > 0 ? !solidAt(nx + p.w, p.y + 2) && !solidAt(nx + p.w, p.y + p.h)
                       : !solidAt(nx, p.y + 2) && !solidAt(nx, p.y + p.h);
    if (ok) p.x = nx;
  }
  if (dy !== 0) {
    const ny = p.y + dy;
    const ok = dy > 0 ? !solidAt(p.x + 2, ny + p.h) && !solidAt(p.x + p.w - 2, ny + p.h)
                       : !solidAt(p.x + 2, ny + 2) && !solidAt(p.x + p.w - 2, ny + 2);
    if (ok) p.y = ny;
  }
}
function updatePlayer() {
  const p = game.player;
  if (p.dead) return;
  let dx = 0, dy = 0;
  if (Input.left) dx -= 1; if (Input.right) dx += 1;
  if (Input.up) dy -= 1; if (Input.down) dy += 1;
  p.moving = (dx !== 0 || dy !== 0);
  if (p.moving) {
    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 'right' : 'left';
    else p.dir = dy > 0 ? 'down' : 'up';
    const nl = Math.hypot(dx, dy); dx /= nl; dy /= nl;
    p.walkT += 0.15;
  }
  tryMove(p, dx, dy);
  if (p.iframe > 0) p.iframe--;
  if (p.slowT > 0) p.slowT--;
  if (p.swingCd > 0) p.swingCd--;
  if (p.swing > 0) p.swing--;
  if (Input.consumeAtk() && p.swingCd <= 0 && p.swing <= 0) {
    p.swing = 14; p.swingCd = 22; AudioSys.swing();
    // small lunge in facing direction, classic action feel
    if (p.dir === 'down') tryMove(p, 0, 3);
    else if (p.dir === 'up') tryMove(p, 0, -3);
    else if (p.dir === 'right') tryMove(p, 3, 0);
    else tryMove(p, -3, 0);
    doSwingHit();
  }
  // mute zone check
  const t = tileAt(p.x + 6, p.y + 8);
  game.muteZone = (t === 'M');
  // camera follows
  const tx = Math.max(0, Math.min(game.area.map[0].length * TILE - W, p.x + 8 - W / 2));
  const ty = Math.max(0, Math.min(game.area.map.length * TILE - H, p.y + 8 - H / 2));
  game.cam.x += (tx - game.cam.x) * 0.12; game.cam.y += (ty - game.cam.y) * 0.12;
  // door tiles (guard: don't retrigger mid-fade)
  if (t === 'D' && game.fadeDir === 0) {
    if (game.state === 'bossfight') return;
    AudioSys.fanfare();
    if (game.areaIdx === 0) fadeTo(() => { loadArea(1); game.state = 'play';
      startDialog([['Maestro', 'The Dungeon of Doubt. Mind the purple ground. Doubt lives there, and it will slow your steps.']]); });
    else if (game.areaIdx === 1) fadeTo(() => { loadArea(2); game.state = 'play';
      startDialog([['???', '...so... quiet...'], ['???', 'TURN BACK.']]); });
    else if (game.areaIdx === 2) fadeTo(() => startBoss());
    return;
  }
  // NPC talk
  for (const n of game.npcs) {
    if (Math.abs(p.x - n.x) < 20 && Math.abs(p.y - n.y) < 20 && Input.consumeStart()) {
      startDialog(n.dialog); break;
    }
  }
  // notes
  for (const n of game.notesList) {
    if (!n.taken && Math.abs(p.x + 6 - n.x) < 14 && Math.abs(p.y + 6 - n.y) < 14) {
      n.taken = true; game.notes++;
      AudioSys.chime(game.notes - 1);
      const names = ['DO', 'RE', 'MI', 'FA', 'SOL', 'LA', 'TI', 'DO'];
      startDialog([[game.playerName, 'A note of the lost song... "' + names[(game.notes - 1) % 8] + '" (' + game.notes + ' of 8)']]);
    }
  }
}
function swingBox() {
  const p = game.player, r = 22;
  const cx = p.x + 6, cy = p.y + 7;
  if (p.dir === 'down') return { x: cx - 12, y: cy, w: 24, h: 18 };
  if (p.dir === 'up') return { x: cx - 12, y: cy - 20, w: 24, h: 18 };
  if (p.dir === 'right') return { x: cx, y: cy - 12, w: 18, h: 24 };
  return { x: cx - 18, y: cy - 12, w: 18, h: 24 };
}
function doSwingHit() {
  const b = swingBox();
  let connected = false;
  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
      connected = true;
      e.hp -= 1; e.hurt = 8; AudioSys.hit();
      Parts.spark(e.x + e.w / 2, e.y + e.h / 2);
      const p = game.player, cx = p.x + 6, cy = p.y + 7;
      const ang = Math.atan2(e.y + e.h / 2 - cy, e.x + e.w / 2 - cx);
      e.kx = Math.cos(ang) * 3; e.ky = Math.sin(ang) * 3;
      if (e.hp <= 0) {
        Parts.poof(e.x + e.w / 2, e.y + e.h / 2);
        // hearts sometimes drop, Zelda style
        if (Math.random() < 0.25) game.heartsDrops.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, t: 0 });
        if (e.type === 'critic') { game.criticDefeated = true; AudioSys.fanfare(); }
        if (e.type === 'boss') bossHit();
      } else if (e.type === 'boss') {
        bossDamaged(); // phase transition check
      }
    }
  }
  if (connected) game.hitStop = 4; // freeze frames on connect: the Nintendo feel
}
function updateEnemies() {
  const p = game.player;
  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    if (e.hurt > 0) e.hurt--;
    e.t += 0.08;
    // knockback decay
    e.x += e.kx; e.y += e.ky; e.kx *= 0.85; e.ky *= 0.85;
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    const px = p.x + 6, py = p.y + 7;
    const dx = px - cx, dy = py - cy, dist = Math.hypot(dx, dy) || 1;
    if (e.type === 'blank' || e.type === 'doubt') {
      if (dist < 90) { tryMove(e, dx / dist, dy / dist); }
      else { e.dir *= -1; tryMove(e, Math.sin(e.t) * e.dir, Math.cos(e.t * 0.7) * e.dir); }
      if (e.type === 'doubt' && dist < 40 && Math.random() < 0.02) {
        // doubt saps you: slow + brief mute of your swing sound
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { p.slowT = 120; }
      }
    } else if (e.type === 'critic') {
      // the Critic parrots your moves: mirrors your direction
      if (dist < 140) tryMove(e, dx / dist * 0.8, dy / dist * 0.8);
      e.atkT = (e.atkT || 0) + 1;
      if (e.atkT > 90 && dist < 120) { e.atkT = 0; fireProj(cx, cy, dx / dist, dy / dist, 1.0); AudioSys.hit(); }
    }
    // touch damage (not during dialogue)
    if (game.state !== 'dialog' && !p.dead && Math.abs(cx - px) < (e.w + 10) / 2 && Math.abs(cy - py) < (e.h + 10) / 2) {
      if (e.type === 'doubt') p.slowT = 150;
      hurtPlayer(e.dmg);
    }
  }
  game.enemies = game.enemies.filter(e => e.hp > 0);
  // heart pickups
  for (const h of game.heartsDrops) {
    h.t++;
    if (!p.dead && Math.abs(h.x - (p.x + 6)) < 12 && Math.abs(h.y - (p.y + 7)) < 12) {
      h.taken = true;
      if (p.hearts < p.maxHearts) { p.hearts++; AudioSys.chime(4); Parts.spark(h.x, h.y); }
    }
  }
  game.heartsDrops = game.heartsDrops.filter(h => !h.taken && h.t < 600);
  // projectiles
  for (const pr of game.projs) {
    pr.x += pr.vx; pr.y += pr.vy; pr.life--;
    if (!p.dead && Math.abs(pr.x - (p.x + 6)) < 9 && Math.abs(pr.y - (p.y + 7)) < 9) {
      hurtPlayer(1); pr.life = 0;
    }
    if (solidAt(pr.x, pr.y)) pr.life = 0;
  }
  game.projs = game.projs.filter(pr => pr.life > 0);
}
function fireProj(x, y, vx, vy, sp) {
  game.projs.push({ x, y, vx: vx * sp, vy: vy * sp, life: 160 });
}

/* ---------------- Rendering ---------------- */
let GFX = {};
function initGfx() {
  buildTiles();
  GFX.hats = buildHats();
  GFX.swing = buildSwing();
  GFX.blank = buildBlank();
  GFX.doubt = buildDoubt();
  GFX.critic = buildCritic();
  GFX.silence = buildSilence();
  GFX.note = buildNote();
  GFX.maestro = buildMaestro();
  GFX.playerSets = TUNICS.map((_, i) => buildPlayer(i));
}
function tileImg(ch, tx, ty) {
  const t = Math.floor(game.time / 30);
  switch (ch) {
    case '#': return game.areaIdx === 0 ? TILES.tree : TILES.wall;
    case '.': case 'P': return TILES.grass;
    case ',': return TILES.flower;
    case '~': return TILES.water[t % 2];
    case '=': return TILES.bridge;
    case 'T': return TILES.tree;
    case 'f': return TILES.floor;
    case 'd': return TILES.floorD;
    case 'M': return TILES.mute;
    case '*': return TILES.pillar;
    case '+': return TILES.carpet;
    case 'D': return game.areaIdx === 0 ? TILES.path : TILES.door;
    case 'S': return TILES.sign;
    default: return TILES.grass;
  }
}
function renderWorld() {
  const m = game.area.map;
  const x0 = Math.max(0, Math.floor(game.cam.x / TILE)), x1 = Math.min(m[0].length - 1, Math.ceil((game.cam.x + W) / TILE));
  const y0 = Math.max(0, Math.floor(game.cam.y / TILE)), y1 = Math.min(m.length - 1, Math.ceil((game.cam.y + H) / TILE));
  let sx = 0, sy = 0;
  if (game.shake > 0) { sx = (Math.random() - 0.5) * game.shake; sy = (Math.random() - 0.5) * game.shake; game.shake *= 0.9; if (game.shake < 0.5) game.shake = 0; }
  ctx.save();
  ctx.translate(-Math.round(game.cam.x + sx), -Math.round(game.cam.y + sy));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const img = tileImg(m[y][x], x, y);
    if (img) ctx.drawImage(img, x * TILE, y * TILE);
  }
  // notes
  for (const n of game.notesList) {
    if (n.taken) continue;
    const bob = Math.sin(game.time / 18 + n.x) * 3;
    drawSpr(GFX.note[Math.floor(game.time / 25) % 2], n.x - 8, n.y - 14 + bob);
  }
  // heart drops
  for (const h of game.heartsDrops) {
    const bob = Math.sin(game.time / 16 + h.x) * 2;
    ctx.fillStyle = '#1a1c2c'; ctx.fillRect(h.x - 5, h.y - 5 + bob, 11, 10);
    ctx.fillStyle = '#e63946'; ctx.fillRect(h.x - 4, h.y - 4 + bob, 9, 8);
    ctx.fillStyle = '#ff8a94'; ctx.fillRect(h.x - 3, h.y - 3 + bob, 3, 3);
  }
  // npcs
  for (const n of game.npcs) {
    drawSpr(GFX.maestro, n.x, n.y);
    if (Math.abs(game.player.x - n.x) < 24 && Math.abs(game.player.y - n.y) < 24) {
      ctx.fillStyle = '#ffd250'; ctx.font = '9px "Courier New", monospace';
      ctx.fillText('! TALK', n.x - 2, n.y - 6);
    }
  }
  // enemies (sorted with player by y)
  const draws = [];
  for (const e of game.enemies) if (e.hp > 0) draws.push({ y: e.y + e.h, f: () => drawEnemy(e) });
  draws.push({ y: game.player.y + 13, f: drawPlayer });
  draws.sort((a, b) => a.y - b.y).forEach(d => d.f());
  // projectiles: silence orbs
  for (const pr of game.projs) {
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath(); ctx.arc(pr.x, pr.y, 5 + Math.sin(game.time / 6) * 1, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7a5fa8'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
  Parts.draw(game.cam.x, game.cam.y);
  // mute zone vignette
  if (game.muteZone) {
    const g = ctx.createRadialGradient(W/2, H/2, 60, W/2, H/2, 200);
    g.addColorStop(0, 'rgba(40,20,70,0)'); g.addColorStop(1, 'rgba(40,20,70,0.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
}
function drawEnemy(e) {
  if (e.hurt > 0 && Math.floor(game.time / 3) % 2 === 0) {
    ctx.save(); ctx.globalAlpha = 0.6;
  }
  const fr = Math.floor(e.t / 20) % 2;
  if (e.type === 'blank') drawSpr(GFX.blank[fr], e.x, e.y);
  else if (e.type === 'doubt') drawSpr(GFX.doubt[fr], e.x, e.y);
  else if (e.type === 'critic') {
    drawSpr(GFX.critic, e.x - 2, e.y - 2);
    // hp bar
    ctx.fillStyle = '#1a1c2c'; ctx.fillRect(e.x - 2, e.y - 8, 24, 4);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(e.x - 1, e.y - 7, 22 * (e.hp / 10), 2);
  }
  else if (e.type === 'boss') {
    drawSpr(GFX.silence, e.x - 8, e.y - 12);
    // boss hp bar top
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(72, 10, W - 144, 8);
    ctx.fillStyle = '#7a5fa8'; ctx.fillRect(74, 12, (W - 148) * (e.hp / 40), 4);
    ctx.fillStyle = '#fff'; ctx.font = '9px "Courier New", monospace';
    ctx.fillText('THE SILENCE', W / 2 - 34, 8);
  }
  if (e.hurt > 0 && Math.floor(game.time / 3) % 2 === 0) ctx.restore();
}
function drawPlayer() {
  const p = game.player;
  if (p.iframe > 0 && Math.floor(game.time / 4) % 2 === 0) return; // blink
  const set = GFX.playerSets[game.tunic];
  const fr = p.moving ? Math.floor(p.walkT) % 2 : 0;
  let img, flip = false;
  if (p.dir === 'down') img = set.down[fr];
  else if (p.dir === 'up') img = set.up[fr];
  else { img = set.side[fr]; flip = (p.dir === 'left'); }
  drawSpr(img, p.x + 2, p.y + 1, flip);
  // hat overlay
  if (game.hat === 1) drawSpr(GFX.hats.cap, p.x + 2, p.y - 2, flip);
  if (game.hat === 2) drawSpr(GFX.hats.crownBig, p.x - 4, p.y - 4, flip);
  // sword swing
  if (p.swing > 0) {
    const sw = GFX.swing[p.swing > 7 ? 0 : 1];
    const cx = p.x + 8, cy = p.y + 7;
    if (p.dir === 'down') drawSpr(sw, cx - 8, cy + 2);
    else if (p.dir === 'up') drawSpr(sw, cx - 8, cy - 22);
    else if (p.dir === 'right') { ctx.save(); ctx.translate(cx + 20, cy - 8); ctx.rotate(Math.PI / 2); ctx.drawImage(sw, -8, -8); ctx.restore(); }
    else { ctx.save(); ctx.translate(cx - 20, cy - 8); ctx.rotate(-Math.PI / 2); ctx.drawImage(sw, -8, -8); ctx.restore(); }

}
function drawHUD() {
  // hearts
  for (let i = 0; i < game.player.maxHearts; i++) {
    const x = 10 + i * 14, y = 10;
    ctx.fillStyle = '#1a1c2c'; ctx.fillRect(x, y, 11, 10);

    ctx.fillRect(x + 1, y + 1, 9, 8);

    ctx.fillRect(x + 2, y + 2, 3, 3);
  }

  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(W - 66, 8, 58, 14);

  ctx.fillStyle = '#cfcfdd'; ctx.font = '9px "Courier New", monospace';

/* ---------------- Title: LTTP-homage intro, original ---------------- */
const Title = {
  t: 0, phase: 0, notes: [], puffs: [],
  crownY: -60, crownV: 0, letters: [], flash: 0, shakeT: 0, rayA: 0,
  reset() {
    this.t = 0; this.phase = 0; this.notes = []; this.puffs = [];
    this.crownY = -60; this.crownV = 0; this.letters = [];
    this.flash = 0; this.shakeT = 0; this.rayA = 0;
  },
  shake(n) { this.shakeT = Math.max(this.shakeT, n); },
  puff(x, y, big) {
    for (let i = 0; i < (big ? 14 : 6); i++) {
      const a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * (big ? 2.2 : 1.2);
      this.puffs.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: 22 + Math.random() * 10 });
    }
  },
  spawnLetters() {
    const mk = (word, y0, delay) => {
      const cw = 19, x0 = W / 2 - (word.length * cw) / 2 + cw / 2;
      for (let i = 0; i < word.length; i++)
        this.letters.push({ ch: word[i], x: x0 + i * cw, y: -24 - i * 10, v: 0,
          ty: y0, delay: delay + i * 9, landed: false, squash: 0 });
    };
    mk("THE KING'S", 138, 0);
    mk("LOST SONG", 170, 95);
  },
  update() {
    this.t++;
    if (this.flash > 0) this.flash--;
    if (this.shakeT > 0) this.shakeT--;
    for (const p of this.puffs) { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--; }
    this.puffs = this.puffs.filter(p => p.life > 0);
    if (this.phase === 0) {
      // darkness, then lightning cracks the sky
      if (this.t === 55) { this.flash = 9; this.shake(14); AudioSys.thunder(); }
      if (this.t > 105) { this.phase = 1; this.t = 0; }
    } else if (this.phase === 1) {
      // the crown drops from the heavens and SLAMS down
      this.crownV += 0.85; this.crownY += this.crownV;
      if (this.crownY >= 78 && this.crownV > 0) {
        this.crownY = 78; this.crownV = 0;
        this.flash = 11; this.shake(20);
        AudioSys.boom(); this.puff(W / 2, 96, true);
        this.spawnLetters(); this.phase = 2; this.t = 0;
      }
    } else if (this.phase === 2) {
      // title letters crash down one by one
      let all = true;
      for (const L of this.letters) {
        if (L.landed) { if (L.squash > 0) L.squash--; continue; }
        all = false;
        if (this.t < L.delay) continue;
        L.v += 0.55; L.y += L.v;
        if (L.y >= L.ty) {
          L.y = L.ty; L.landed = true; L.squash = 7;
          AudioSys.thud(); this.shake(3); this.puff(L.x, L.ty + 8, false);
        }
      }
      if (all && this.t > 200) { this.phase = 3; this.t = 0; }
    } else if (this.phase === 3) {
      this.rayA += 0.008;
      if (this.t % 8 === 0 && this.notes.length < 50)
        this.notes.push({ x: Math.random() * W, y: -10, v: 0.8 + Math.random() * 1.2, s: Math.random() < 0.5 });
      for (const n of this.notes) n.y += n.v;
      this.notes = this.notes.filter(n => n.y < H + 10);
      if (Input.consumeStart()) { AudioSys.fanfare(); NameEntry.reset(); game.state = 'name'; }
    }
  },
  drawCrown(x, y, s) {
    // s = scale; crown slams in at (x, y)
    ctx.fillStyle = '#ffd250';
    const w = 30 * s, h = 9 * s;
    ctx.fillRect(x - w, y, w * 2, h);
    for (let i = -1; i <= 1; i++) {
      const px = x + i * w * 0.62;
      ctx.beginPath();
      ctx.moveTo(px - 7 * s, y); ctx.lineTo(px, y - 13 * s); ctx.lineTo(px + 7 * s, y);
      ctx.fill();
    }
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x - 4 * s, y + 2 * s, 8 * s, 4 * s);
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(x - w + 2 * s, y + 2 * s, 5 * s, 2 * s);
  },
  draw() {
    ctx.save();
    if (this.shakeT > 0)
      ctx.translate((Math.random() - 0.5) * this.shakeT * 0.7, (Math.random() - 0.5) * this.shakeT * 0.7);
    ctx.fillStyle = '#050508'; ctx.fillRect(-20, -20, W + 40, H + 40);
    if (this.phase >= 1) {
      // storm clouds parting behind the crown
      const g = ctx.createRadialGradient(W/2, 70, 10, W/2, 70, 190);
      g.addColorStop(0, 'rgba(90,80,140,0.5)'); g.addColorStop(1, 'rgba(5,5,8,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // the crown, fallen from above
      const cs = this.phase === 1 ? Math.min(1.6, 1 + this.crownV * 0.03) : 1.6;
      this.drawCrown(W / 2, this.crownY, cs);
    }
    if (this.phase >= 2) {
      // god rays bursting behind the title
      if (this.phase === 3) {
        ctx.save(); ctx.translate(W / 2, 154); ctx.rotate(this.rayA);
        ctx.fillStyle = 'rgba(255,210,80,0.05)';
        for (let i = 0; i < 12; i++) {
          ctx.rotate(Math.PI / 6);
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(220, -26); ctx.lineTo(220, 26); ctx.fill();
        }
        ctx.restore();
      }
      ctx.textAlign = 'center'; ctx.font = 'bold 27px "Courier New", monospace';
      for (const L of this.letters) {
        if (this.t < L.delay && !L.landed && this.phase === 2) continue;
        const sy = L.landed && L.squash > 0 ? 1 - (L.squash / 7) * 0.25 : 1;
        ctx.save(); ctx.translate(L.x, L.y); ctx.scale(1, sy);
        ctx.fillStyle = L.ty < 150 ? '#ffd250' : '#f4f4f4';
        ctx.fillText(L.ch, 0, 0);
        ctx.restore();
      }
      ctx.textAlign = 'left';
    }
    if (this.phase >= 2) {
      // dust puffs
      ctx.fillStyle = 'rgba(180,170,200,0.55)';
      for (const p of this.puffs) ctx.fillRect(p.x, p.y, 2, 2);
    }
    if (this.phase === 3) {
      // staff lines + note rain under the finished title
      ctx.strokeStyle = 'rgba(120,110,160,0.35)'; ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(20, 62 + i * 9); ctx.lineTo(W - 20, 62 + i * 9); ctx.stroke(); }
      ctx.fillStyle = '#8f86b8';
      for (const n of this.notes) {
        ctx.fillRect(n.x, n.y, 3, 3);
        ctx.fillRect(n.x + 3, n.y + (n.s ? -4 : 4), 1, 6);
      }
      if (Math.floor(game.time / 30) % 2 === 0) {
        ctx.fillStyle = '#f4f4f4'; ctx.font = '12px "Courier New", monospace'; ctx.textAlign = 'center';
        ctx.fillText('ontouchstart' in window ? 'TAP TO BEGIN' : 'PRESS ENTER', W / 2, 212);
        ctx.textAlign = 'left';
      }
    }
    // lightning flash overlay
    if (this.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (this.flash / 11) * 0.9 + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    // vignette
    const v = ctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, 230);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = v; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.restore();
  }
};
/* ---------------- Name entry ---------------- */
const NameEntry = {
  name: '', grid: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', sel: 0,
  reset() { this.name = ''; this.sel = 0; },
  type(ch) {
    ch = ch.toUpperCase();
    if (/[A-Z0-9 ]/.test(ch) && this.name.length < 10) { this.name += ch; AudioSys.blip(); }
  },
  back() { this.name = this.name.slice(0, -1); AudioSys.blip(); },
  update() {
    const cols = 9;
    if (Input.left) { this.sel = (this.sel + 26) % 27; Input.left = false; AudioSys.blip(); }
    if (Input.right) { this.sel = (this.sel + 1) % 27; Input.right = false; AudioSys.blip(); }
    if (Input.up) { this.sel = (this.sel + 18) % 27; Input.up = false; AudioSys.blip(); }
    if (Input.down) { this.sel = (this.sel + 9) % 27; Input.down = false; AudioSys.blip(); }
    if (Input.consumeAtk()) {
      if (this.sel < 26) this.type(this.grid[this.sel]);
      else this.back();
      Input._atkQ = false;
    }
    if (Input.consumeStart() && this.name.length > 0) {
      game.playerName = this.name; AudioSys.fanfare(); Story.reset(); game.state = 'story';
    }
  },
  draw() {
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd250'; ctx.font = 'bold 14px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('WHO SEEKS THE SONG?', W / 2, 40);
    ctx.fillStyle = '#f4f4f4'; ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText((this.name || '_') + (Math.floor(game.time / 25) % 2 ? '|' : ''), W / 2, 80);
    ctx.font = '14px "Courier New", monospace';
    const cols = 9;
    for (let i = 0; i < 27; i++) {
      const x = W / 2 - 4 * 24 + (i % cols) * 24, y = 110 + Math.floor(i / cols) * 24;
      if (i === this.sel) { ctx.fillStyle = '#ffd250'; ctx.fillRect(x - 9, y - 13, 20, 20); }
      ctx.fillStyle = i === this.sel ? '#1a1c2c' : '#8f86b8';
      ctx.fillText(i < 26 ? this.grid[i] : '⌫', x, y);
    }
    ctx.fillStyle = '#8f86b8'; ctx.font = '10px "Courier New", monospace';
    ctx.fillText('ontouchstart' in window ? 'TAP LETTERS, THEN TAP HERE WHEN DONE' : 'TYPE OR ARROW + SPACE, ENTER WHEN DONE', W / 2, 200);
    ctx.textAlign = 'left';
    // tap letter support
    if (!this._tapBound) {
      this._tapBound = true;
      cv.addEventListener('touchstart', e => {
        if (game.state !== 'name') return;
        const r = cv.getBoundingClientRect();
        const tx = (e.touches[0].clientX - r.left) / r.width * W;
        const ty = (e.touches[0].clientY - r.top) / r.height * H;
        for (let i = 0; i < 27; i++) {
          const x = W / 2 - 4 * 24 + (i % cols) * 24, y = 110 + Math.floor(i / cols) * 24;
          if (tx > x - 12 && tx < x + 12 && ty > y - 16 && ty < y + 8) {
            if (i < 26) this.type(this.grid[i]); else this.back();
          }
        }
        if (ty > 185) { if (this.name.length > 0) { game.playerName = this.name; AudioSys.fanfare(); Story.reset(); game.state = 'story'; } }
      });
    }
  }
};
/* ---------------- Story roll ---------------- */
const Story = {
  y: 0, t: 0,
  lines: [
    'Long ago, in the kingdom of Harmonia,',
    'music was life itself.',
    '',
    'Every heart kept time.',
    'Every voice carried a tune.',
    '',
    'The King held the most perfect song',
    'ever written. A melody so true',
    'it kept the whole kingdom in harmony.',
    '',
    'Then came The Silence.',
    '',
    'It stole the King\'s song and scattered',
    'its eight notes across the land,',
    'locking the last of them in a castle',
    'where no sound has ever returned.',
    '',
    'Without the song, silence spread',
    'like a stain. Doubt crept through',
    'the meadows. The kingdom began',
    'to forget how to sing.',
    '',
    'But the King remembers.',
    '',
    'And what was stolen',
    'can be taken back.'
  ],
  reset() { this.y = H + 20; this.t = 0; },
  update() {
    this.t++; this.y -= 0.45;
    if (Input.skip || Input.consumeStart() || Input.consumeAtk() || this.y < -this.lines.length * 20 - 40) {
      Customize.reset(); game.state = 'customize'; Input.skip = false;
    }
  },
  draw() {
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
    // drifting staff lines
    ctx.strokeStyle = 'rgba(120,110,160,0.25)';
    for (let i = 0; i < 5; i++) { const yy = (i * 60 + game.time / 8) % (H + 60) - 30;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
    ctx.textAlign = 'center'; ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#e8e4f4';
    this.lines.forEach((l, i) => {
      const yy = this.y + i * 20;
      if (yy > -10 && yy < H + 10) {
        if (l.includes('Silence')) ctx.fillStyle = '#7a5fa8'; else ctx.fillStyle = '#e8e4f4';
        ctx.fillText(l, W / 2, yy);
      }
    });
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8f86b8'; ctx.font = '10px "Courier New", monospace';
    ctx.fillText('SKIP', W - 40, H - 12);
  }
};
/* ---------------- Customization ---------------- */
const Customize = {
  tunic: 0, hat: 2, col: 0,
  reset() { this.tunic = 0; this.hat = 2; this.col = 0; },
  update() {
    if (Input.left) { this.ch(-1); Input.left = false; }
    if (Input.right) { this.ch(1); Input.right = false; }
    if (Input.up || Input.down) { this.col = 1 - this.col; Input.up = Input.down = false; AudioSys.blip(); }
    if (Input.consumeStart() || Input.consumeAtk()) {
      game.tunic = this.tunic; game.hat = this.hat;
      AudioSys.fanfare();
      game.player = newPlayer();
      fadeTo(() => { loadArea(0); game.state = 'play'; game.startTime = Date.now();
        startDialog([
          [game.playerName, 'The meadow is too quiet...'],
          ['Maestro', 'Find the eight notes, ' + game.playerName + '. The Dungeon of Doubt lies north.']
        ]);
      });
    }
  },
  ch(d) {
    if (this.col === 0) this.tunic = (this.tunic + d + TUNICS.length) % TUNICS.length;
    else this.hat = (this.hat + d + HATS.length) % HATS.length;
    AudioSys.blip();
  },
  draw() {
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd250'; ctx.font = 'bold 14px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('DRESS FOR THE QUEST', W / 2, 36);
    // preview (big)
    const set = GFX.playerSets[this.tunic];
    ctx.save(); ctx.translate(W / 2 - 24, 66); ctx.scale(3, 3);
    ctx.drawImage(set.down[0], 0, 0);
    ctx.restore();
    if (this.hat === 1) { ctx.save(); ctx.translate(W / 2 - 24, 60); ctx.scale(3, 3); ctx.drawImage(GFX.hats.cap, 0, 0); ctx.restore(); }
    if (this.hat === 2) { ctx.save(); ctx.translate(W / 2 - 36, 54); ctx.scale(3, 3); ctx.drawImage(GFX.hats.crownBig, 0, 0); ctx.restore(); }
    ctx.font = '12px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = this.col === 0 ? '#ffd250' : '#8f86b8';
    ctx.fillText((this.col === 0 ? '> ' : '  ') + 'TUNIC: ' + TUNICS[this.tunic].name, W / 2, 150);
    ctx.fillStyle = this.col === 1 ? '#ffd250' : '#8f86b8';
    ctx.fillText((this.col === 1 ? '> ' : '  ') + 'HAT: ' + HATS[this.hat], W / 2, 170);
    ctx.fillStyle = '#f4f4f4'; ctx.font = '11px "Courier New", monospace';
    if (Math.floor(game.time / 30) % 2 === 0) ctx.fillText('PRESS ENTER TO BEGIN', W / 2, 200);
    ctx.textAlign = 'left';
  }
};

/* ---------------- Boss: The Silence ---------------- */
function startBoss() {
  game.atBoss = true;
  game.area = buildArena();
  const m = game.area.map;
  game.enemies = []; game.projs = []; game.notesList = []; game.npcs = [];
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m[0].length; x++)
    if (m[y][x] === 'P') { game.player.x = x * TILE; game.player.y = y * TILE; m[y][x] = 'd'; }
  game.state = 'bossfight';
  snapCamera();
  MUSIC.play('boss');
  const b = { x: W / 2 - 8, y: 50, w: 16, h: 28, type: 'boss', hp: 40, t: 0, dir: 1,
    hurt: 0, kx: 0, ky: 0, atkT: 0, tx: W / 2, ty: 60, phase: 1, dmg: 1, speed: 0.5 };
  game.enemies.push(b); game.boss = b;
  startDialog([
    ['The Silence', '...'],
    ['The Silence', 'YOU SHOULD NOT HAVE COME.'],
    ['The Silence', 'THE SONG IS MINE NOW. THERE IS NOTHING LEFT FOR YOU.'],
    [game.playerName, 'Give it back.']
  ]);
}
function bossDamaged() {
  const b = game.boss;
  if (b && b.hp <= 20 && b.phase === 1) {
    b.phase = 2; b.speed = 0.85;
    AudioSys.fanfare();
    startDialog([
      ['The Silence', 'ENOUGH.'],
      ['The Silence', 'FEEL HOW QUIET THE WORLD BECOMES.']
    ]);
  }
}
function bossHit() {
  const b = game.boss;
  if (b.hp <= 0) {
    MUSIC.stop();
    game.bossDefeated = true;
    AudioSys.playSong();
    fadeTo(() => { Ending.reset(); game.state = 'ending'; });
  }
}
function updateBoss() {
  const b = game.boss;
  if (!b || b.hp <= 0) return;
  b.t += 0.06; b.atkT++;
  // drift toward a teleport target
  const dx = b.tx - (b.x + 8), dy = b.ty - (b.y + 14);
  const d = Math.hypot(dx, dy) || 1;
  if (d > 4) { b.x += dx / d * b.speed; b.y += dy / d * b.speed; }
  else if (Math.random() < 0.02) { // teleport
    b.tx = 40 + Math.random() * (W - 80); b.ty = 30 + Math.random() * 90;
  }
  const rate = b.phase === 1 ? 110 : 65;
  if (b.atkT > rate) {
    b.atkT = 0;
    const p = game.player, cx = b.x + 8, cy = b.y + 14;
    const n = b.phase === 1 ? 1 : 3;
    for (let i = 0; i < n; i++) {
      const ang = Math.atan2(p.y + 7 - cy, p.x + 6 - cx) + (i - (n - 1) / 2) * 0.35;
      fireProj(cx, cy, Math.cos(ang), Math.sin(ang), 1.15);
    }
    AudioSys.hit();
  }
  // spawn doubts in phase 2
  if (b.phase === 2 && Math.random() < 0.008 && game.enemies.length < 5) {
    spawnEnemy('doubt', 40 + Math.random() * (W - 80), 40 + Math.random() * 100);
  }
}
/* ---------------- Ending ---------------- */
const Ending = {
  t: 0, phase: 0,
  reset() { this.t = 0; this.phase = 0; MUSIC.stop(); },
  update() {
    this.t++;
    if (this.phase === 0 && this.t > 200) {
      this.phase = 1;
      startDialog([
        ['The Silence', '...why... do you still... sing...'],
        [game.playerName, 'Because it was never yours to take.'],
        ['The Silence', 'THE NOTES... THEY WERE...'],
        [game.playerName, 'Mine. They were always mine.'],
        ['The Silence', '...then... I was only ever... borrowing... your doubt...'],
      ], () => { this.phase = 2; this.t = 0; AudioSys.playSong(); });
      game.state = 'dialog'; game.preDialogState = 'ending';
    } else if (this.phase === 2 && this.t > 700) {
      // record score
      const secs = Math.floor((Date.now() - game.startTime) / 1000);
      saveScore(game.playerName, secs, game.notes);
      Scores.reset(); game.state = 'scores';
    }
    if (this.phase === 2 && Input.skip) { this.t = 700; Input.skip = false; }
  },
  draw() {
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
    // the eight notes assemble and play
    const cx = W / 2, cy = 100;
    ctx.font = 'bold 13px "Courier New", monospace'; ctx.textAlign = 'center';
    if (this.phase === 0) {
      ctx.fillStyle = '#7a5fa8';
      ctx.fillText('THE SILENCE FADES...', cx, cy);
    } else {
      // notes orbit and converge
      for (let i = 0; i < 8; i++) {
        const a = game.time / 40 + i * Math.PI / 4;
        const r = Math.max(8, 60 - this.t / 8);
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.6;
        drawSpr(GFX.note[i % 2], x - 8, y - 8);
      }
      ctx.fillStyle = '#ffd250';
      ctx.fillText('THE SONG WAS YOURS', cx, 170);
      ctx.fillText('ALL ALONG.', cx, 188);
      ctx.fillStyle = '#8f86b8'; ctx.font = '10px "Courier New", monospace';
      ctx.fillText('...and the kingdom remembers how to sing.', cx, 208);
    }
    ctx.textAlign = 'left';
    if (game.dialog) drawDialog();
  }
};
/* ---------------- Game over ---------------- */
function updateGameOver() {
  game.goT++;
  if (game.goT > 60 && (Input.consumeStart() || Input.consumeAtk())) {
    game.player = newPlayer();
    game.player.hearts = game.player.maxHearts;
    game.heartsDrops = [];
    MUSIC.stop();
    if (game.atBoss) fadeTo(() => startBoss());
    else fadeTo(() => { loadArea(game.areaIdx); game.state = 'play'; });
  }
}
function drawGameOver() {
  ctx.fillStyle = '#0a0a10'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7a5fa8'; ctx.font = 'bold 26px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillText('SILENCED...', W / 2, 100);
  ctx.fillStyle = '#8f86b8'; ctx.font = '11px "Courier New", monospace';
  if (game.goT > 60 && Math.floor(game.time / 30) % 2 === 0)
    ctx.fillText('PRESS ENTER TO TRY AGAIN', W / 2, 150);
  ctx.textAlign = 'left';
}
/* ---------------- High scores (local) ---------------- */
function loadScores() {
  try { return JSON.parse(localStorage.getItem('kls_scores') || '[]'); } catch (e) { return []; }
}
function saveScore(name, secs, notes) {
  const s = loadScores();
  s.push({ name: name.substring(0, 10), secs, notes, date: Date.now() });
  s.sort((a, b) => a.secs - b.secs);
  try { localStorage.setItem('kls_scores', JSON.stringify(s.slice(0, 5))); } catch (e) {}
}
function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const Scores = {
  t: 0, reset() { this.t = 0; AudioSys.fanfare(); },
  update() {
    this.t++;
    if (this.t > 90 && (Input.consumeStart() || Input.consumeAtk())) {
      Title.reset(); game.state = 'title'; MUSIC.play('title');
    }
  },
  draw() {
    ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd250'; ctx.font = 'bold 18px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('HALL OF SONGS', W / 2, 40);
    const s = loadScores();
    ctx.font = '11px "Courier New", monospace';
    if (!s.length) { ctx.fillStyle = '#8f86b8'; ctx.fillText('No songs completed yet.', W / 2, 100); }
    s.forEach((r, i) => {
      ctx.fillStyle = i === 0 ? '#ffd250' : '#e8e4f4';
      ctx.fillText((i + 1) + '. ' + r.name + '  ' + fmtTime(r.secs) + '  ' + r.notes + '/8', W / 2, 80 + i * 22);
    });
    ctx.fillStyle = '#8f86b8'; ctx.font = '10px "Courier New", monospace';
    if (this.t > 90 && Math.floor(game.time / 30) % 2 === 0) ctx.fillText('PRESS ENTER', W / 2, 200);
    ctx.textAlign = 'left';
  }
};
function drawScores(y) { // mini scores on title screen
  const s = loadScores().slice(0, 3);
  if (!s.length) return;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(W / 2 - 90, y - 14, 180, 20 + s.length * 14);
  ctx.font = '9px "Courier New", monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd250'; ctx.fillText('BEST SONGS', W / 2, y);
  s.forEach((r, i) => { ctx.fillStyle = '#8f86b8'; ctx.fillText(r.name + ' ' + fmtTime(r.secs), W / 2, y + 14 + i * 13); });
  ctx.textAlign = 'left';
}

/* ---------------- Main loop ---------------- */
function update() {
  game.time++;
  // hit-stop: freeze the world for impact frames
  if (game.hitStop > 0) { game.hitStop--; return; }
  Parts.update();
  // fade transitions
  if (game.fadeDir === 1) {
    game.fade += 0.08;
    if (game.fade >= 1) { game.fade = 1; game.fadeDir = -1; const cb = game.fadeCb; game.fadeCb = null; if (cb) cb(); }
  } else if (game.fadeDir === -1) {
    game.fade -= 0.08;
    if (game.fade <= 0) { game.fade = 0; game.fadeDir = 0; }
  }
  switch (game.state) {
    case 'boot': Title.reset(); game.state = 'title'; MUSIC.play('title'); break;
    case 'title': Title.update(); break;
    case 'name': NameEntry.update(); break;
    case 'story': Story.update(); break;
    case 'customize': Customize.update(); break;
    case 'play':
      updatePlayer(); updateEnemies();
      break;
    case 'bossfight':
      updatePlayer(); updateEnemies(); updateBoss();
      break;
    case 'dialog':
      updateDialog();
      if (game.preDialogState === 'play' || game.preDialogState === 'bossfight') { updateEnemies(); }
      break;
    case 'ending': Ending.update(); if (game.dialog) updateDialog(); break;
    case 'gameover': updateGameOver(); break;
    case 'scores': Scores.update(); break;
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  switch (game.state) {
    case 'title': Title.draw(); break;
    case 'name': NameEntry.draw(); break;
    case 'story': Story.draw(); break;
    case 'customize': Customize.draw(); break;
    case 'play': case 'bossfight': renderWorld(); break;
    case 'dialog': renderWorld(); drawDialog(); break;
    case 'ending': Ending.draw(); break;
    case 'gameover': drawGameOver(); break;
    case 'scores': Scores.draw(); break;
  }
  if (game.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + game.fade + ')'; ctx.fillRect(0, 0, W, H); }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
// boot
initGfx();
Input.init();
game.player = newPlayer();
loop();
</script>
